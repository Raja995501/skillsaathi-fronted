server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy to the backend container (docker-compose service name "backend") —
    # this only works inside the compose network; in production (frontend on Vercel,
    # backend on api.skillsaathi.com) the frontend calls the API's real domain directly
    # instead, so VITE_API_BASE_URL is set to the real URL at build time in that case.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://backend:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s; # keep long-lived WebSocket connections alive
    }

    # React Router uses client-side routing (BrowserRouter) — any path that isn't a real
    # static file must fall back to index.html, or a hard refresh on e.g. /matches 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
